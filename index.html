<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff8e8">

    <title>Keith & Anne's Diamond Challenge</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="quiz-locked">

<div id="passwordGate" class="password-gate">
    <div class="password-box">
        <h1>💎 Keith & Anne's Diamond Challenge</h1>
        <p>Please enter the family password to begin.</p>

        <input
            id="quizPassword"
            type="password"
            placeholder="Family password"
            autocomplete="off">

        <button id="passwordSubmit" type="button">
            Enter
        </button>

        <p id="passwordMessage" class="password-message"></p>
    </div>
</div>

<div class="container">

    <img
        src="images/wedding.jpg"
        class="hero-photo"
        alt="Keith and Anne's Wedding">

    <h1 class="title">
    <span class="diamond">💎</span>
    Keith & Anne's Diamond Challenge
    <span class="diamond">💎</span>
</h1>

    <p class="subtitle">
        Celebrating 60 Wonderful Years Together
    </p>

    <p class="dates">
        <strong>1966 – 2026</strong>
    </p>

    <input
        type="text"
        id="playerName"
        placeholder="Enter your name">

    <button
        class="start-btn"
        id="startButton">

        Start Challenge

    </button>

</div>

<script src="js/password.js"></script>
<script src="js/app.js"></script>

</body>

</html>
